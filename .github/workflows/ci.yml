name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libzstd-dev mesa-vulkan-drivers sway grim lua5.4

      # rust-toolchain.toml selects the pinned toolchain and components.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Workspace swap fault injection
        run: lua5.4 scripts/workspace-swap-lua-check.lua

      - name: Dependency inventory is current
        run: scripts/license-inventory.py --check

      - name: Headless Wayland smoke
        run: |
          cargo build --locked
          scripts/smoke-headless.sh target/debug/orbit smoke-output
          bash scripts/workspace-reorder-check.sh target/debug/orbit smoke-output/workspace-swap

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-output

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
